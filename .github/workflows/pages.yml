name: Deploy Hajkić to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, gd, intl, mbstring, xml, zip
          coverage: none

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static site
        env:
          HAJKIC_BASE_URL: ${{ steps.pages.outputs.base_url }}
          HAJKIC_STATIC_BUILD: '1'
          HAJKIC_ENV: production
        run: php scripts/build-static.php --out=_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
